<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
  <title>GRIND</title>
  <link rel="stylesheet" href="../fonts/fonts.css">
  <link rel="stylesheet" href="grind.css">
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#0b0b0c"/>
          <path d="M16 5a11 11 0 1 0 11 11h-6.5a4.5 4.5 0 1 1-4.5-4.5V5z" fill="#FF4F2E"/>
          <rect x="17.5" y="5" width="9.5" height="9.5" rx="1.5" fill="#FFC23D"/>
        </svg>
        <span class="word">GRIND</span>
      </div>
      <div class="bar-mid"><div class="sess" id="sess"></div><div class="bar-week" id="bar-week"></div></div>
      <div class="win">
        <button data-win="min" title="Minimise" aria-label="Minimise"><svg viewBox="0 0 12 12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.4"/></svg></button>
        <button data-win="max" title="Maximise" aria-label="Maximise"><svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
        <button data-win="close" class="x" title="Hide to tray" aria-label="Close"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.4"/></svg></button>
      </div>
    </header>

    <nav class="rail" id="rail">
      <button data-go="home" class="on"><i class="sh sh-sq"></i><span>home</span></button>
      <button data-go="learn"><i class="sh sh-tri"></i><span>learn</span></button>
      <button data-go="posts"><i class="sh sh-ci"></i><span>posts</span></button>
      <button data-go="goals"><i class="sh sh-di"></i><span>goals</span></button>
      <div class="rail-gap"></div>
      <button data-go="settings"><i class="sh sh-ring"></i><span>settings</span></button>
      <div class="rail-foot" id="rail-foot"></div>
    </nav>

    <main class="main" id="main"></main>
  </div>

  <div class="modal" id="modal" hidden></div>
  <div class="toast" id="toast" role="status"></div>

  <script src="../core/derive.js"></script>
  <script src="curriculum.js"></script>
  <script src="app.js"></script>
</body>
</html>
